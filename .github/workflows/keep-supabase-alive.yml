# Mantém o projeto do Supabase (plano gratuito) ativo.
# O plano Free pausa projetos depois de 1 semana sem uso.
# Este workflow faz uma consulta simples ao banco a cada 3 dias.
#
# Precisa de 2 secrets no GitHub (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       -> https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  -> a chave anon / public
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 12 */3 * *" # a cada 3 dias, por volta das 9h17 (horário de Brasília)
  workflow_dispatch: # permite rodar na mão pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ao banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Cadastre os secrets SUPABASE_URL e SUPABASE_ANON_KEY no GitHub."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/roadmaps?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Resposta do Supabase: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::O Supabase respondeu HTTP $status. Confira se o projeto está pausado no painel."
            exit 1
          fi
